name: nebula-learning
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nebula
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a private environment file}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula -d nebula"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ../services/api
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://nebula:${POSTGRES_PASSWORD}@db:5432/nebula
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      AI_PROVIDER: mock
    command: sh -c 'alembic upgrade head && python -m app.cli seed'
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ../services/api
    environment: *api-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8410
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8410/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ../services/api
    environment: *api-env
    command: celery -A app.tasks:celery worker --loglevel=info --concurrency=2
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    build: ../services/api
    environment: *api-env
    command: celery -A app.tasks:celery beat --loglevel=info --schedule /scheduler/beat.db
    volumes: ["scheduler_data:/scheduler"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build:
      context: ../apps/web
      args:
        API_INTERNAL_URL: http://api:8410
    environment:
      API_INTERNAL_URL: http://api:8410
      HOSTNAME: 0.0.0.0
      PORT: 3410
    ports: ["127.0.0.1:3410:3410"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  scheduler_data:
