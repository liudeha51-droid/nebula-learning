name: Animation models and web quality gates
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/animation-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
