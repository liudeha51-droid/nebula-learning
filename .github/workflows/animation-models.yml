name: Animation models and web quality gates
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/animation-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements.txt
        working-directory: .
      - run: python -m alembic upgrade head
        working-directory: services/api
      - run: python -m app.cli seed
        working-directory: services/api
      - run: npx playwright install --with-deps chromium
      - name: Start isolated development API
        working-directory: services/api
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8410 > api-ci.log 2>&1 &
      - name: Start development web app
        run: |
          npm run start > web-ci.log 2>&1 &
      - name: Browser E2E in Chromium
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8410/api/v1/health > /dev/null && curl -fsS http://127.0.0.1:3410/ > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8410/api/v1/health
          curl -fsS http://127.0.0.1:3410/ > /dev/null
          npx playwright test tests/animation-lab.spec.mjs
      - name: Print local server logs on failure
        if: failure()
        working-directory: .
        run: |
          tail -100 services/api/api-ci.log || true
          tail -100 apps/web/web-ci.log || true
